version: '3.8'

services:
  pdf-parser-service:
    build:
      context: ./backend
      dockerfile: parser_service/Dockerfile
      args:
        PARSER_FLAVOR: ${PDF_PARSER_FLAVOR:-mineru}
    container_name: starmap-pdf-parser-service
    ports:
      - "8090:8090"
    environment:
      - PDF_PARSER_SERVICE_DEFAULT=${PDF_PARSER_SERVICE_DEFAULT:-mineru}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  # MySQL 主数据库
  mysql:
    image: docker.io/mysql:8.0
    container_name: starmap-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=starmap_root_123
      - MYSQL_DATABASE=starmap
      - MYSQL_USER=starmap
      - MYSQL_PASSWORD=starmap123
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init_mysql.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=256M
      --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: docker.io/redis:7-alpine
    container_name: starmap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Scrapy 爬虫服务（任务消费模式）
  scrapy-service:
    build:
      context: ./backend/scrapy_service
      dockerfile: Dockerfile
    container_name: starmap-scrapy-service
    volumes:
      - ./backend/scrapy_service:/app
      - ./backend/downloads:/app/downloads
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=starmap
      - MYSQL_PASSWORD=starmap123
      - MYSQL_DATABASE=starmap
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_STORE=/app/downloads
      - LOG_LEVEL=INFO
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python main.py --mode consumer

volumes:
  mysql_data:
  redis_data:
