version: '3.8'

services:
  pdf-parser-service:
    build:
      context: ./backend
      dockerfile: parser_service/Dockerfile
      args:
        MINERU_PACKAGE_SPEC: ${MINERU_PACKAGE_SPEC:-mineru[pipeline]>=3.3,<4}
    container_name: starmap-pdf-parser-service
    ports:
      - "8090:8090"
    volumes:
      - mineru_cache:/root/.cache
    environment:
      - PARSER_SERVICE_HOST=0.0.0.0
      - PARSER_SERVICE_PORT=8090
      - MINERU_MODEL_SOURCE=${MINERU_MODEL_SOURCE:-}
      - MINERU_TOOLS_CONFIG_JSON=${MINERU_TOOLS_CONFIG_JSON:-/root/.cache/mineru/mineru.json}
      - MINERU_PDF_RENDER_THREADS=${MINERU_PDF_RENDER_THREADS:-1}
      - MINERU_PDF_RENDER_TIMEOUT=${MINERU_PDF_RENDER_TIMEOUT:-600}
      - MINERU_PROCESSING_WINDOW_SIZE=${MINERU_PROCESSING_WINDOW_SIZE:-1}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health').read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  qdrant:
    image: docker.io/qdrant/qdrant:latest
    container_name: starmap-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6333/collections').read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  # BGE-M3 本地向量化服务（infinity 提供 OpenAI 兼容接口）
  bge-m3:
    image: docker.io/michaelf34/infinity:0.0.75
    container_name: starmap-bge-m3
    ports:
      - "7997:7997"
    volumes:
      - bge_m3_cache:/app/.cache
    environment:
      - HF_HOME=/app/.cache/huggingface
    command: >
      v2
      --model-id BAAI/bge-m3
      --port 7997
      --host 0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  # MySQL 主数据库
  mysql:
    image: docker.io/mysql:8.0
    container_name: starmap-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=starmap_root_123
      - MYSQL_DATABASE=starmap
      - MYSQL_USER=starmap
      - MYSQL_PASSWORD=starmap123
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/scripts/init_mysql.sql:/docker-entrypoint-initdb.d/01-init-mysql.sql:ro
      - ./backend/scripts/init_408_tables.sql:/docker-entrypoint-initdb.d/02-init-408.sql:ro
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb_buffer_pool_size=256M
      --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存
  redis:
    image: docker.io/redis:7-alpine
    container_name: starmap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Scrapy 爬虫服务（任务消费模式）
  scrapy-service:
    build:
      context: ./backend/scrapy_service
      dockerfile: Dockerfile
    container_name: starmap-scrapy-service
    volumes:
      - ./backend/scrapy_service:/app
      - ./backend/downloads:/app/downloads
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=starmap
      - MYSQL_PASSWORD=starmap123
      - MYSQL_DATABASE=starmap
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_STORE=/app/downloads
      - LOG_LEVEL=INFO
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python main.py --mode consumer

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: starmap-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/venv
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=starmap
      - MYSQL_PASSWORD=starmap123
      - MYSQL_DATABASE=starmap
      - REDIS_URL=redis://redis:6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PDF_PARSER_LOCAL_ENDPOINT=http://pdf-parser-service:8090
      - CORPUS_UPLOAD_DIR=/app/uploads
      - CORPUS_UPLOAD_MAX_BYTES=${CORPUS_UPLOAD_MAX_BYTES:-209715200}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:-development-only-admin-jwt-secret-change-me}
      - ADMIN_JWT_EXPIRE_MINUTES=${ADMIN_JWT_EXPIRE_MINUTES:-480}
      - AUTH_ACTION_TOKEN_SECRET=${AUTH_ACTION_TOKEN_SECRET:-development-only-action-token-secret-change-me}
      - AUTH_CSRF_SECRET=${AUTH_CSRF_SECRET:-development-only-csrf-secret-change-me}
      - AUTH_IDENTIFIER_HMAC_SECRET=${AUTH_IDENTIFIER_HMAC_SECRET:-development-only-identifier-secret-change-me}
      - AUTH_FRONTEND_BASE_URL=${AUTH_FRONTEND_BASE_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]}
      - AUTH_GITHUB_CLIENT_ID=${AUTH_GITHUB_CLIENT_ID:-}
      - AUTH_GITHUB_CLIENT_SECRET=${AUTH_GITHUB_CLIENT_SECRET:-}
      - AUTH_GITHUB_CALLBACK_URL=${AUTH_GITHUB_CALLBACK_URL:-http://localhost:8000/api/v1/auth/github/callback}
      - AUTH_GITHUB_TRANSACTION_MINUTES=${AUTH_GITHUB_TRANSACTION_MINUTES:-10}
      - AUTH_EMAIL_BACKEND=${AUTH_EMAIL_BACKEND:-memory}
      - AUTH_EMAIL_FROM_ADDRESS=${AUTH_EMAIL_FROM_ADDRESS:-}
      - AUTH_EMAIL_FROM_NAME=${AUTH_EMAIL_FROM_NAME:-408 学习工作台}
      - AUTH_EMAIL_REPLY_TO=${AUTH_EMAIL_REPLY_TO:-}
      - AUTH_SMTP_HOST=${AUTH_SMTP_HOST:-}
      - AUTH_SMTP_PORT=${AUTH_SMTP_PORT:-587}
      - AUTH_SMTP_USERNAME=${AUTH_SMTP_USERNAME:-}
      - AUTH_SMTP_PASSWORD=${AUTH_SMTP_PASSWORD:-}
      - AUTH_SMTP_SECURITY=${AUTH_SMTP_SECURITY:-starttls}
      - AUTH_SMTP_TIMEOUT_SECONDS=${AUTH_SMTP_TIMEOUT_SECONDS:-10}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENV=development
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      pdf-parser-service:
        condition: service_healthy
    command: sh -c "alembic -c alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: starmap-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.dev
    container_name: starmap-frontend-admin
    ports:
      - "5174:5174"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1/admin
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
  mineru_cache:
  bge_m3_cache:
